server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: payment-service-project
  jackson:
    serialization:
      write-dates-as-timestamps: false
  datasource:
    # H2 in PostgreSQL compatibility mode -> schema & SQL yang sama dengan Postgres
    url: jdbc:h2:mem:payments;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      pool-name: payments-hikari
      maximum-pool-size: 10
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        query:
          in_clause_parameter_padding: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  cache:
    # simple = ConcurrentMap (default, no external dependency).
    # Profile "redis" mengganti ini ke RedisCacheManager.
    type: simple
  threads:
    virtual:
      # Hanya bisa true di JDK 21 (lihat application-java21.yml)
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  health:
    redis:
      enabled: false

app:
  security:
    api-key: local-dev-key
  partner:
    base-url: http://localhost:8080
    client-id: payment-demo
    secret: super-secret-hmac-key-change-me
    timeout: 2s
  reconciliation:
    enabled: true
    interval-ms: 30000
    in-doubt-after: 5s
  sandbox:
    enabled: true
  outbox:
    enabled: true
    interval-ms: 5000
    initial-delay-ms: 10000
    retention: 7d

resilience4j:
  circuitbreaker:
    instances:
      partner:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        registerHealthIndicator: true
  retry:
    instances:
      partner:
        maxAttempts: 2
        waitDuration: 200ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - org.springframework.web.reactive.function.client.WebClientRequestException
          - java.util.concurrent.TimeoutException

logging:
  level:
    root: INFO
    com.vian.payments: INFO
    io.github.resilience4j: INFO
